{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card mt-5 shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">註冊新帳號 🚀</h3>
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">選擇帳號名稱</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">設定密碼</label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2">立即註冊</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted">已經有帳號了？</span> 
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold">點此登入</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
