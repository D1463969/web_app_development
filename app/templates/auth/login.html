{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card mt-5 shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">歡迎登入 👋</h3>
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">帳號名稱</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">密碼</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">登入系統</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted">還沒有帳號嗎？</span> 
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-bold">點此註冊</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
